[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ci-mcp"
version = "0.1.0"
description = "MCP server that runs Python in Azure's hosted code interpreter (Responses API) and delivers artifacts into LibreChat."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
azure-ci-mcp = "azci_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
